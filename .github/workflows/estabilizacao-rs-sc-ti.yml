name: CONTROLE MESTRE — Estabilizacao RS SC TI

on:
  push:
    branches:
      - fix/estabilizacao-rs-sc-ti-uso-diario
  pull_request:
    branches:
      - feat/prioridade-inteligente-catalogo-v088

permissions:
  contents: read

jobs:
  safe-daily:
    name: Uso diario — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Suíte Python completa, incluindo persistencia HTTP e backup
        run: python -m unittest discover -s tests -v
      - name: Diagnostico do inicializador em banco descartavel
        env:
          CONTROLE_MESTRE_DB: ${{ runner.temp }}/cm-stability-test.sqlite
        run: python launch.py --diagnostico
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificação sintática de módulos JavaScript
        run: |
          node --check web/app.js
          find web/modules -name '*.js' -print0 | xargs -0 -n1 node --check
