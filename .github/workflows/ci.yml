name: CONTROLE MESTRE — Testes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validar núcleo e API local
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe da interface
        run: |
          node --check web/app.js
          node --check web/modules/format.js
          node --check web/modules/http.js
          node --check web/modules/assessments.js