<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Logo Sidebar CONTROLE MESTRE">
  
  <defs>
    <!-- Gradientes de Dourado Premium -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFEA00"/>
      <stop offset="55%" stop-color="#FFD600"/>
      <stop offset="85%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFD600"/>
      <stop offset="70%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8D6E10"/>
    </linearGradient>
    <linearGradient id="gold-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#FFEA00"/>
      <stop offset="60%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#D4A017" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2026"/>
      <stop offset="100%" stop-color="#101114"/>
    </linearGradient>

    <!-- Gradiente Metálico Prateado para o Rei Tombado e CONTROLE -->
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="65%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="silver-subtle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Gradiente do Peão (Preto Grafite Polido) -->
    <radialGradient id="pawn-body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3A3F47"/>
      <stop offset="45%" stop-color="#1D2026"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </radialGradient>
    <linearGradient id="pawn-specular" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFD600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtros de Brilho Sutil -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtle-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ícone compacto à esquerda -->
  <g transform="translate(6, 4)">
    <rect width="56" height="56" rx="14" fill="#101114" stroke="url(#gold-stroke)" stroke-width="2"/>
    
    <g transform="translate(28,28) scale(0.19) translate(-140,-135)">
      <!-- Tabuleiro / Base reflexiva com perspectiva -->
      <path d="M 30,225 L 250,225 L 275,255 L 5,255 Z" fill="#131518" opacity="0.85"/>
      <path d="M 30,225 L 5,255" stroke="#2D333B" stroke-width="2" opacity="0.6"/>
      <path d="M 85,225 L 72,255" stroke="#2D333B" stroke-width="2" opacity="0.6"/>
      <path d="M 140,225 L 140,255" stroke="#2D333B" stroke-width="2" opacity="0.6"/>
      <path d="M 195,225 L 207,255" stroke="#2D333B" stroke-width="2" opacity="0.6"/>
      <path d="M 250,225 L 275,255" stroke="#2D333B" stroke-width="2" opacity="0.6"/>
      <path d="M 15,240 L 265,240" stroke="#2D333B" stroke-width="2" opacity="0.6"/>

      <!-- Brilho dourado no piso sob o peão -->
      <ellipse cx="115" cy="235" rx="55" ry="12" fill="#FFD600" opacity="0.22" filter="url(#gold-glow)"/>

      <!-- Escudo / Brasão Heráldico de Fundo -->
      <path d="M 60,35 L 140,15 L 220,35 L 220,125 C 220,175 160,205 140,215 C 120,205 60,175 60,125 Z" 
            fill="url(#shield-bg)" stroke="url(#gold-stroke)" stroke-width="6" stroke-linejoin="round" filter="url(#subtle-shadow)"/>
      <path d="M 70,44 L 140,27 L 210,44 L 210,123 C 210,166 157,194 140,202 C 123,194 70,166 70,123 Z" 
            fill="none" stroke="url(#gold-stroke)" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.6"/>

      <!-- Livro Aberto no topo do brasão -->
      <g transform="translate(140, 52) scale(0.85)">
        <!-- Página Esquerda -->
        <path d="M -2,-2 C -10,-8 -24,-8 -32,-3 L -32,18 C -24,13 -10,13 -2,18 Z" fill="url(#gold-grad)" stroke="#101114" stroke-width="1.5"/>
        <!-- Página Direita -->
        <path d="M 2,-2 C 10,-8 24,-8 32,-3 L 32,18 C 24,13 10,13 2,18 Z" fill="url(#gold-grad)" stroke="#101114" stroke-width="1.5"/>
        <!-- Lombada / Marcador -->
        <polygon points="-2,-2 2,-2 0,22" fill="#FFEA00"/>
      </g>

      <!-- Ramos de Louro Dourados envolvendo o livro -->
      <g transform="translate(140, 85)" fill="url(#gold-grad)" stroke="#101114" stroke-width="0.8">
        <!-- Ramo Esquerdo -->
        <path d="M -48,-35 C -56,-20 -58,0 -46,18 C -48,8 -52,-15 -48,-35 Z" fill="none" stroke="url(#gold-stroke)" stroke-width="2.5"/>
        <path d="M -50,-28 C -58,-32 -62,-25 -56,-20 C -52,-22 -50,-25 -50,-28 Z"/>
        <path d="M -54,-14 C -64,-16 -65,-8 -58,-4 C -55,-7 -54,-11 -54,-14 Z"/>
        <path d="M -52,2 C -62,3 -61,12 -54,14 C -52,10 -51,6 -52,2 Z"/>
        <path d="M -44,18 C -52,24 -48,32 -42,30 C -41,25 -42,21 -44,18 Z"/>

        <!-- Ramo Direito -->
        <path d="M 48,-35 C 56,-20 58,0 46,18 C 48,8 52,-15 48,-35 Z" fill="none" stroke="url(#gold-stroke)" stroke-width="2.5"/>
        <path d="M 50,-28 C 58,-32 62,-25 56,-20 C 52,-22 50,-25 50,-28 Z"/>
        <path d="M 54,-14 C 64,-16 65,-8 58,-4 C 55,-7 54,-11 54,-14 Z"/>
        <path d="M 52,2 C 62,3 61,12 54,14 C 52,10 51,6 52,2 Z"/>
        <path d="M 44,18 C 52,24 48,32 42,30 C 41,25 42,21 44,18 Z"/>
      </g>

      <!-- REI TOMBADO (Silver Metal King, caído em ângulo de ~68 graus à direita) -->
      <g transform="translate(162, 185) rotate(68)" filter="url(#subtle-shadow)">
        <!-- Cruz no topo da coroa -->
        <path d="M 0,-56 L 0,-38 M -7,-49 L 7,-49" stroke="url(#silver-metal)" stroke-width="5" stroke-linecap="square"/>
        <!-- Cúpula da Coroa -->
        <path d="M -12,-38 C -10,-42 10,-42 12,-38 L 14,-22 L -14,-22 Z" fill="url(#silver-metal)" stroke="#101114" stroke-width="1.8"/>
        <!-- Aro com Ameias/Florões da Coroa -->
        <path d="M -18,-22 L -18,-15 L 18,-15 L 18,-22 L 11,-18 L 0,-24 L -11,-18 Z" fill="url(#silver-metal)" stroke="#101114" stroke-width="1.8"/>
        <rect x="-20" y="-15" width="40" height="6" rx="2" fill="url(#gold-grad)" stroke="#101114" stroke-width="1.2"/>
        <!-- Pescoço e Corpo do Rei -->
        <path d="M -15,-9 C -12,12 -24,25 -25,48 L 25,48 C 24,25 12,12 15,-9 Z" fill="url(#silver-metal)" stroke="#101114" stroke-width="2"/>
        <!-- Anel Central Dourado do Rei -->
        <rect x="-22" y="24" width="44" height="5" rx="2" fill="url(#gold-grad)" stroke="#101114" stroke-width="1"/>
        <!-- Base Escalonada do Rei -->
        <path d="M -28,48 L 28,48 L 30,58 L -30,58 Z" fill="url(#silver-metal)" stroke="#101114" stroke-width="2"/>
        <rect x="-33" y="58" width="66" height="8" rx="2" fill="url(#silver-metal)" stroke="#101114" stroke-width="2"/>
      </g>

      <!-- PEÃO VENCEDOR (Foreground Black & Gold Pawn com postura imponente) -->
      <g transform="translate(112, 108)" filter="url(#subtle-shadow)">
        <!-- Cabeça Esférica do Peão -->
        <circle cx="0" cy="0" r="26" fill="url(#pawn-body)" stroke="url(#gold-stroke)" stroke-width="2.5"/>
        <circle cx="-6" cy="-7" r="22" fill="url(#pawn-specular)"/>
        <ellipse cx="-8" cy="-10" rx="8" ry="5" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 -8 -10)"/>

        <!-- Colar/Anel do Pescoço com Acabamento Dourado -->
        <ellipse cx="0" cy="24" rx="20" ry="5" fill="url(#gold-grad)" stroke="#101114" stroke-width="1.5"/>

        <!-- Corpo Cônico e Curvado do Peão -->
        <path d="M -16,25 C -15,48 -28,70 -30,95 L 30,95 C 28,70 15,48 16,25 Z" fill="url(#pawn-body)" stroke="url(#gold-stroke)" stroke-width="2"/>
        <!-- Brilho no bojo do corpo -->
        <path d="M -10,32 C -9,52 -18,72 -20,90" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

        <!-- Base Escalonada e Robusta com Frisos de Ouro -->
        <path d="M -32,95 L 32,95 L 35,107 L -35,107 Z" fill="url(#gold-grad)" stroke="#101114" stroke-width="2"/>
        <rect x="-42" y="107" width="84" height="15" rx="5" fill="url(#pawn-body)" stroke="url(#gold-stroke)" stroke-width="2.5"/>
        <rect x="-40" y="112" width="80" height="4" rx="2" fill="url(#gold-grad)" opacity="0.9"/>
      </g>

      <!-- FAIXA ESPIRAL DOURADA LUMINOSA ENVOLVENDO O PEÃO -->
      <path d="M 68,205 C 80,185 145,170 155,145 C 165,120 120,95 105,108 C 90,120 135,140 148,155 C 165,175 105,215 72,218 Z" 
            fill="url(#gold-ribbon)" filter="url(#gold-glow)" opacity="0.92"/>
      <path d="M 69,206 C 85,182 143,168 152,146 C 160,125 125,102 110,111" 
            fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    </g>
    
  </g>

  <!-- Tipografia à direita -->
  <g transform="translate(74, 9)">
    <text x="0" y="19" fill="#FFFFFF" font-family="'Manrope', 'Montserrat', sans-serif" 
          font-size="16" font-weight="800" letter-spacing="1.5">CONTROLE</text>
    <text x="0" y="36" fill="url(#gold-grad)" font-family="'Manrope', 'Montserrat', sans-serif" 
          font-size="18" font-weight="900" letter-spacing="2">MESTRE</text>
    <text x="0" y="48" fill="#94A3B8" font-family="'DM Sans', sans-serif" 
          font-size="7.5" font-weight="700" letter-spacing="1.5">PLATAFORMA DE ESTUDOS</text>
  </g>
</svg>